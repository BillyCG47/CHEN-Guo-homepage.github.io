name: 陈果课题组  Billy's Research Group
url: https://billycg47.github.io/CHEN-Guo-homepage.github.io/

exclude: [bibble, README.md, Makefile, screenshot.png]

# colorize code snippets with the pygments module
highlighter: pygments

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html
encoding: utf-8
# Sections on the "people" page.
roles:
  - key: faculty
    name: 教师 Professor
  - key: grad
    name: 工人 Workers
  - key: ugrad
    name: 本科生 Undergraduate Students
  - key: collab
    name: 合作者 Collaborators


# Number of news stories on the front page.
front_page_news: 8

# Base pathname for links.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true

# Navigation bar links.
navigation:
  - title: 主页 Home
    link: https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1
  - title: 科研 Research
    link: https://www.sciencedirect.com
  - title: 论文 Publications
    link: https://www.nature.com
